<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Open//77 — Loading</title>
<style>
  /* THE SAME FACES THE UI RESOLVES, SHIPPED BESIDE THIS PAGE.
     open77_infinity declares Rajdhani (display), Saira (body) and IBM Plex Mono
     (labels and data) in `ui/src/design/tokens.css`, and supplies them from
     @fontsource through `ui/src/design/fonts.css`, which the Vite build inlines as
     data URIs. THIS PAGE IS NOT PART OF THAT BUNDLE -- `ui/public/**` is copied
     verbatim into `web/**` -- so a '@fontsource/...' URL here would never resolve and
     every name would silently fall back to Segoe UI. The faces below are the same files
     from the same packages, copied into `fonts/` next to this page. 64 KB, no network.

     ONLY AT WEIGHTS THAT EXIST. A weight with no face behind it renders as synthetic
     bold, which the UI avoids on mono deliberately -- a faux-bold mono loses the
     tabular alignment the data lines depend on. */
  @font-face{
    font-family:'Rajdhani'; font-style:normal; font-weight:700; font-display:block;
    src:url('./fonts/rajdhani-latin-700-normal.woff2') format('woff2');
  }
  @font-face{
    font-family:'IBM Plex Mono'; font-style:normal; font-weight:400; font-display:block;
    src:url('./fonts/ibm-plex-mono-latin-400-normal.woff2') format('woff2');
  }
  @font-face{
    font-family:'IBM Plex Mono'; font-style:normal; font-weight:700; font-display:block;
    src:url('./fonts/ibm-plex-mono-latin-700-normal.woff2') format('woff2');
  }
  @font-face{
    font-family:'Saira'; font-style:normal; font-weight:400; font-display:block;
    src:url('./fonts/saira-latin-400-normal.woff2') format('woff2');
  }

  /* THE SERVER'S OWN LOADING SCREEN.
     The client mounts this page from our verified pack files, in a sandboxed surface,
     OVER the built-in OPEN//77 cover -- so this is what a player sees for the whole of
     the join instead of the stock screen. Our resource declares it with
     `loadscreen "web/loading.html"` in open77.lua and `web/**` ships it.

     THE FILM IS THE BACKGROUND; THE WORDS SIT IN ONE CORNER OVER IT.
     The clip is full-bleed and undistorted-to-fit (object-fit: cover), and every piece
     of copy lives in a single block anchored to the bottom-left, with the player bar
     beneath it in that same stack. That shape is deliberate and it is the whole reason
     the block is a grid: nothing in it is absolutely positioned relative to anything
     else, so no two lines can ever land on each other, and the only thing over the
     picture is that block. A two-stop scrim (one rising from the bottom edge, one from
     the left) darkens exactly the corner the copy occupies, so the rest of the frame
     stays legible as a film rather than being washed grey to make white text work.

     SELF-CONTAINED ON PURPOSE. The surface's origin is confined to this resource and
     there is no network beyond it, so nothing here loads from anywhere else: the
     typefaces are files in `fonts/`, the video and its poster are files in this folder,
     and the colour behind everything is a CSS gradient that is already correct before
     either of them decodes.

     THE CLIP IS A WEBM, AND THAT IS NOT A PREFERENCE. It is VP9 video + Opus audio in
     Matroska, 1280x720, 115 s, ~14.4 MiB -- because the browser this page runs inside
     cannot decode H.264 OR AAC AT ALL. CEF is built with Chromium's free codec set, and
     an MP4 handed to it demuxes and then dies with
         media\filters\ffmpeg_demuxer.cc  PipelineStatus::DEMUXER_ERROR_NO_SUPPORTED_STREAMS
     which is the demuxer reporting that the container is fine and NO stream in it is
     playable. That is worth knowing precisely: "video/mp4" in this runtime means
     nothing, `canPlayType` is no guide, and the file's own name is no guide either --
     the codecs have to be VP8/VP9/AV1 plus Opus/Vorbis. A 15.1 MiB H.264 file sat here
     and simply never played, while the poster and the gradient covered for it so
     convincingly that it looked like a styling choice rather than a decode failure.

     IT MUST ALSO STAY UNDER 16 MiB -- scripting/src/ResourceHost.cpp:40 enforces
     kMaximumWebFileBytes = 16 MiB while scanning `web/**` and refuses with
     `invalid_web_file:<name>`, which fails THE WHOLE RESOURCE, not just this file: the
     loadscreen silently stops arriving and opx_infinity does not start. Both limits are
     checked by byte count, never by trust. If the file is missing or the codec will not
     decode, the poster and the gradient stand in; the progress bar is unaffected either
     way, because it is not the video's job.

     SOUND. The host starts Chromium with `autoplay-policy=user-gesture-required`
     (webhost/src/WebHostApp.cpp:66), so unmuted playback is refused until the page
     receives a real user gesture. The page therefore tries to play WITH sound first and,
     only if that is refused, retries muted and says so. The first click (anywhere) then
     unmutes, within the policy, with no platform change. The gesture only arrives if the
     surface was given cursor focus when it was mounted: the shell mounts this page with
     `page:setFocus(false, true)`, and on a build that still passes `false` for the cursor
     the controls below cannot be clicked and the video stays silent -- the page is
     correct either way and never shows a control it cannot honour as if it had worked.

     IT RUNS BEFORE ANY LUA OF OURS DOES. The resource's scripts are not running during
     the join, so this page cannot ask for anything -- it is told, by the client, over
     exactly two events:
       progress { phase, label, fraction, detail, server }
       server   { name }
     `fraction` is 0..1, or negative for "no idea yet" (the bar sweeps). `label` is what
     to print over `phase`, and Lua is not involved in either. */
  :root{
    --accent:#ff3b47; --accent-hot:#ff6b78;
    --text:#f4e9ec; --dim:#a2696f; --faint:#7a5055;
    --stage:#05070a;
    /* The UI's own stacks in its own order, so a face that fails to decode falls back
       to the same Windows voices the twelve surfaces fall back to. */
    --display:"Rajdhani","Bahnschrift Condensed","Bahnschrift SemiCondensed","Arial Narrow","Segoe UI",sans-serif;
    --body:"Saira","Bahnschrift","Segoe UI",system-ui,sans-serif;
    --mono:"IBM Plex Mono","Cascadia Mono","Consolas",ui-monospace,monospace;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{width:100%;height:100%;overflow:hidden}
  body{background:var(--stage); color:var(--text); font-family:var(--body)}

  /* ── the film, full-bleed and behind everything ────────────────────────────── */
  .stage{position:absolute; inset:0; overflow:hidden; background:#000}
  #video{
    width:100%; height:100%; object-fit:cover; display:block;
    filter:saturate(1.02) contrast(1.02);
  }
  body.no-video #video{display:none}
  body.no-video .stage{
    background:
      radial-gradient(120% 90% at 20% 80%,rgba(42,13,16,.95) 0%,rgba(9,3,5,1) 70%),
      var(--stage);
  }
  /* Darkens the corner the copy sits in and leaves the rest of the frame alone. Two
     stops, because one would have to grey the whole picture to make white text work. */
  .scrim{
    position:absolute; inset:0; pointer-events:none;
    background:
      linear-gradient(to top,rgba(4,2,4,.94) 0%,rgba(4,2,4,.74) 16%,rgba(4,2,4,.30) 40%,rgba(4,2,4,0) 66%),
      linear-gradient(to right,rgba(4,2,4,.82) 0%,rgba(4,2,4,.34) 28%,rgba(4,2,4,0) 54%);
  }
  /* An outline, not a word: it frames the shot and covers no part of it. */
  .frame{position:absolute; inset:18px; pointer-events:none;
    border:1px solid rgba(255,59,71,.16)}
  .frame::before,.frame::after{
    content:""; position:absolute; width:26px; height:26px; border:0 solid var(--accent);
  }
  .frame::before{top:-1px; left:-1px; border-top-width:2px; border-left-width:2px}
  .frame::after{bottom:-1px; right:-1px; border-bottom-width:2px; border-right-width:2px}

  /* ── the words: one block, one corner, nothing absolutely placed inside it ─── */
  .corner{
    position:absolute; z-index:2;
    left:clamp(30px,3.4vw,66px); bottom:clamp(30px,4vh,66px);
    width:min(540px,46vw);
    display:grid; gap:clamp(12px,1.7vh,20px);
    align-content:start;
  }
  .brand{display:grid; gap:2px}
  /* A FLEX ROW, NOT A TEXT RUN, and that is about geometry rather than appearance.
     The face's own content area is 1.28em tall while `.mark` is set at line-height
     .9 -- so as an inline box the accent `//` (and each text run beside it) stands
     74px high inside a 52px line and hangs 8.7px into INFINITY, which is a real box
     collision even though the ink never touches. As flex items they are blockified
     and each takes a line-height-driven box instead, so nothing here can reach the
     line below. Identical pixels: the baseline, the seams and the letter-spacing are
     all unchanged, only the boxes stop overflowing. */
  .mark{
    display:flex; align-items:baseline;
    font:700 clamp(34px,4vw,58px)/.9 var(--display); letter-spacing:.02em;
    text-transform:uppercase; text-shadow:0 2px 30px rgba(0,0,0,.75);
  }
  .mark b{color:var(--accent)}
  .mode{
    color:var(--accent-hot); font:700 10px var(--mono);
    letter-spacing:.46em; text-transform:uppercase;
  }
  .rule{height:1px; background:linear-gradient(90deg,rgba(255,59,71,.55),rgba(255,59,71,0))}

  .status{display:grid; gap:6px}
  .kicker{color:var(--dim); font:700 9px var(--mono); letter-spacing:.3em; text-transform:uppercase}
  .server{
    font:700 clamp(20px,2vw,30px)/1.05 var(--display); letter-spacing:.02em;
    text-transform:uppercase; overflow-wrap:anywhere; text-shadow:0 2px 24px rgba(0,0,0,.7);
  }

  .progress{display:grid; gap:9px}
  .bar-line{display:flex; justify-content:space-between; align-items:baseline; gap:10px}
  .bar-phase{font:700 10px var(--mono); letter-spacing:.18em; text-transform:uppercase}
  .bar-pct{color:var(--accent-hot); font:400 14px var(--mono); font-variant-numeric:tabular-nums}
  .bar{position:relative; height:5px; background:rgba(255,59,71,.16); overflow:hidden;
    box-shadow:0 0 0 1px rgba(255,59,71,.16)}
  .bar-fill{
    width:0; height:100%; background:linear-gradient(90deg,var(--accent),var(--accent-hot));
    box-shadow:0 0 16px rgba(255,59,71,.9);
    transition:width .28s cubic-bezier(.2,.7,.2,1);
  }
  /* No fraction from the client: a sweep, because a bar sitting at zero is a stall. */
  .bar.busy .bar-fill{width:34%; animation:sweep 1.1s cubic-bezier(.4,0,.2,1) infinite}
  @keyframes sweep{from{transform:translateX(-110%)}to{transform:translateX(360%)}}
  .bar-detail{min-height:15px; color:var(--faint); font:400 11px var(--body);
    letter-spacing:.03em; overflow-wrap:anywhere}

  /* ── the player bar, last in the same stack so it cannot collide with anything ─ */
  .player{display:flex; align-items:center; gap:12px; padding-top:2px}
  .btn{
    width:36px; height:36px; flex:0 0 auto; cursor:pointer;
    display:grid; place-items:center;
    background:rgba(255,59,71,.09); color:var(--text);
    border:1px solid rgba(255,59,71,.32); border-radius:2px;
    transition:background .15s linear,border-color .15s linear,color .15s linear;
  }
  .btn:hover{background:rgba(255,59,71,.2); border-color:var(--accent); color:#fff}
  .btn:focus-visible{outline:2px solid var(--accent-hot); outline-offset:2px}
  .btn svg{width:15px; height:15px; fill:currentColor}
  .btn .i-pause,.btn .i-mute{display:none}
  .btn.playing .i-play{display:none}
  .btn.playing .i-pause{display:block}
  .btn.muted .i-vol{display:none}
  .btn.muted .i-mute{display:block}

  .vol{flex:0 0 clamp(96px,11vw,172px); display:flex; align-items:center; gap:9px}
  input[type=range]{
    -webkit-appearance:none; appearance:none; width:100%; height:3px; cursor:pointer;
    background:rgba(255,59,71,.28); border-radius:2px; outline:none;
  }
  input[type=range]::-webkit-slider-thumb{
    -webkit-appearance:none; appearance:none;
    width:12px; height:12px; border-radius:50%;
    background:var(--accent-hot); box-shadow:0 0 10px rgba(255,59,71,.8);
  }
  input[type=range]::-moz-range-thumb{
    width:12px; height:12px; border:0; border-radius:50%;
    background:var(--accent-hot); box-shadow:0 0 10px rgba(255,59,71,.8);
  }
  .vol-val{
    color:var(--dim); font:400 10px var(--mono); letter-spacing:.14em;
    min-width:26px; font-variant-numeric:tabular-nums;
  }
  /* Shown only while the host is refusing unmuted playback and no gesture has landed
     yet -- so a silent screen says why instead of looking broken. */
  .sound-hint{
    display:none; color:var(--accent-hot); font:700 9px var(--mono);
    letter-spacing:.18em; text-transform:uppercase;
  }
  body.needs-gesture .sound-hint{display:block}

  /* Narrow surfaces: the corner block takes the width it needs and nothing else
     moves, because it is the only thing over the picture. */
  @media (max-width:720px){
    .corner{width:min(420px,84vw); gap:12px}
  }
  @media (prefers-reduced-motion:reduce){
    *{animation-duration:.001s!important;transition-duration:.001s!important}
  }
</style>
</head>
<body>
  <div class="stage">
    <!-- VP9 + Opus. An MP4 source would never play here: see the note above. -->
    <video id="video" playsinline preload="auto" loop poster="./loading-poster.jpg">
      <source src="./loading.webm" type="video/webm">
    </video>
    <div class="scrim"></div>
    <div class="frame"></div>
  </div>

  <div class="corner">
    <div class="brand">
      <div class="mark">OPEN<b>//</b>77</div>
      <div class="mode">Infinity</div>
    </div>
    <div class="rule"></div>

    <div class="status">
      <div class="kicker">// Entering the city</div>
      <div class="server" id="server">Open//77</div>
    </div>

    <div class="progress">
      <div class="bar-line">
        <span class="bar-phase" id="phase">Connecting</span>
        <span class="bar-pct" id="pct"></span>
      </div>
      <div class="bar busy" id="bar"><div class="bar-fill" id="fill"></div></div>
      <div class="bar-detail" id="detail"></div>
    </div>

    <div class="player">
      <button class="btn" id="play" type="button" aria-label="Play or pause">
        <svg viewBox="0 0 16 16" aria-hidden="true">
          <path class="i-play" d="M3 1.5v13l11-6.5z"/>
          <g class="i-pause"><rect x="3" y="2" width="4" height="12"/><rect x="9" y="2" width="4" height="12"/></g>
        </svg>
      </button>
      <button class="btn" id="mute" type="button" aria-label="Mute or unmute">
        <svg viewBox="0 0 16 16" aria-hidden="true">
          <g class="i-vol">
            <path d="M2 6h3l4-3.5v11L5 10H2z"/>
            <path d="M11.4 5.2a4 4 0 0 1 0 5.6l-.9-.9a2.8 2.8 0 0 0 0-3.8z"/>
            <path d="M13.3 3.3a6.8 6.8 0 0 1 0 9.4l-.9-.9a5.6 5.6 0 0 0 0-7.6z"/>
          </g>
          <g class="i-mute">
            <path d="M2 6h3l4-3.5v11L5 10H2z"/>
            <path d="M11 6.1l1.1-1.1 3 3-1.1 1.1z"/>
            <path d="M14 6.1l1.1 1.1-3 3-1.1-1.1z" transform="translate(-3.1)"/>
          </g>
        </svg>
      </button>
      <div class="vol">
        <input id="vol" type="range" min="0" max="100" step="1" value="100" aria-label="Volume">
        <span class="vol-val" id="volVal">100</span>
      </div>
      <span class="sound-hint">Click for sound</span>
    </div>
  </div>

<script>
(function(){
  "use strict";
  var $=function(id){return document.getElementById(id)};
  var phaseEl=$("phase"),pctEl=$("pct"),barEl=$("bar"),fillEl=$("fill"),
      detailEl=$("detail"),serverEl=$("server"),videoEl=$("video"),
      playEl=$("play"),muteEl=$("mute"),volEl=$("vol"),volValEl=$("volVal");

  /* ── the player ────────────────────────────────────────────────────────────── */
  // Why the play/pause state is read from the element rather than kept in a flag: a
  // refused autoplay, a decode error and the reduced-motion pause all leave the
  // element paused without anyone asking, and the button has to agree with what the
  // screen is actually doing.
  var pref = {volume:1, muted:false};
  try{
    var raw = localStorage.getItem("op77.loadscreen.media");
    if(raw){
      var saved = JSON.parse(raw);
      if(typeof saved.volume==="number" && saved.volume>=0 && saved.volume<=1) pref.volume=saved.volume;
      if(typeof saved.muted==="boolean") pref.muted=saved.muted;
    }
  }catch(e){}
  function persist(){
    try{ localStorage.setItem("op77.loadscreen.media", JSON.stringify(pref)); }catch(e){}
  }

  function paint(){
    var playing = videoEl && !videoEl.paused;
    playEl.classList.toggle("playing", !!playing);
    var silent = !videoEl || videoEl.muted || videoEl.volume===0;
    muteEl.classList.toggle("muted", !!silent);
    if(videoEl){
      var shown = Math.round((videoEl.muted?0:videoEl.volume)*100);
      volValEl.textContent = shown;
      if(volEl.value !== String(shown)) volEl.value = String(shown);
    }
  }

  var reduced = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  function noVideo(){
    document.body.classList.add("no-video");
  }

  // One gesture is all the policy wants. Any click, tap or key the host manages to
  // deliver satisfies it -- listening on the document means the player controls and
  // the background both work, and a gesture used for anything else still counts.
  function satisfiedGesture(){
    document.body.classList.remove("needs-gesture");
    if(videoEl && !videoEl.muted) return;
    if(!videoEl || pref.muted) return;
    videoEl.muted = false;
    videoEl.volume = pref.volume;
    if(videoEl.paused) start();
    paint();
  }
  ["pointerdown","mousedown","click","keydown","touchstart"].forEach(function(name){
    document.addEventListener(name, satisfiedGesture, true);
  });

  // Unmuted first, muted only if the host refuses. Setting `muted` on an element that
  // was never allowed to start would leave a frozen frame, so the retry happens after
  // the rejection rather than before it.
  function start(){
    if(!videoEl) return;
    videoEl.volume = pref.volume;
    videoEl.muted = pref.muted;
    var attempt = videoEl.play();
    if(attempt && attempt.catch){
      attempt.catch(function(){
        if(pref.muted) return;
        videoEl.muted = true;
        var retry = videoEl.play();
        if(retry && retry.catch) retry.catch(function(){});
        document.body.classList.add("needs-gesture");
        paint();
      });
    }
  }

  if(videoEl){
    videoEl.addEventListener("canplay", function(){ document.body.classList.remove("no-video"); });
    videoEl.addEventListener("playing", paint);
    videoEl.addEventListener("pause", paint);
    videoEl.addEventListener("volumechange", paint);
    videoEl.addEventListener("error", noVideo);
    if(videoEl.networkState===3) noVideo();
    if(reduced){
      // The poster is the whole picture for someone who asked for less motion. The
      // player bar stays live, so pressing play is theirs to choose -- and that press
      // is itself the gesture that permits sound.
      videoEl.pause();
    }else{
      start();
    }
    paint();
  }

  playEl.addEventListener("click", function(){
    if(!videoEl) return;
    if(videoEl.paused) start(); else videoEl.pause();
    paint();
  });
  muteEl.addEventListener("click", function(){
    if(!videoEl) return;
    var goingSilent = !videoEl.muted && videoEl.volume>0;
    if(goingSilent){
      pref.muted = true;
      videoEl.muted = true;
    }else{
      pref.muted = false;
      videoEl.muted = false;
      if(pref.volume===0) pref.volume = 0.6;
      videoEl.volume = pref.volume;
      if(videoEl.paused) start();
    }
    persist();
    paint();
  });
  volEl.addEventListener("input", function(){
    if(!videoEl) return;
    var value = Number(volEl.value)/100;
    videoEl.volume = value;
    pref.volume = value;
    // Dragging the slider to zero is a mute, and dragging it up is an unmute: the
    // element already reflects that, so the preference follows the slider rather than
    // fighting it.
    if(value===0){ videoEl.muted = true; pref.muted = true; }
    else { videoEl.muted = false; pref.muted = false; if(videoEl.paused) start(); }
    persist();
    paint();
  });
  volEl.addEventListener("change", persist);

  /* ── the client's two events ───────────────────────────────────────────────── */
  // The client's own phase names, rendered only when the payload carries no `label`.
  // A phase this table does not know is printed with its underscores opened out,
  // because an unknown word on screen beats a blank line.
  var PHASES={connecting:"Connecting",handshake:"Authenticating",authenticating:"Authenticating",
    manifest:"Reading manifest",downloading:"Downloading",verifying:"Verifying",
    ready:"Preparing",world:"Loading",active:"Loading",failed:"Failed"};

  function onProgress(p){
    if(!p) return;
    if(p.server) serverEl.textContent=p.server;
    var label=p.label||PHASES[p.phase]||String(p.phase||"").replace(/_/g," ")||"Loading";
    phaseEl.textContent=label;
    var f=Number(p.fraction);
    if(!isFinite(f)||f<0){
      barEl.classList.add("busy"); fillEl.style.width="0%"; pctEl.textContent="";
    }else{
      barEl.classList.remove("busy");
      var pct=Math.max(0,Math.min(100,Math.round(f*100)));
      fillEl.style.width=pct+"%"; pctEl.textContent=pct+"%";
    }
    if(typeof p.detail==="string") detailEl.textContent=p.detail;
  }

  if(window.Open77){
    try{ Open77.on("progress",onProgress); }catch(e){}
    try{ Open77.on("server",function(v){ if(v&&v.name) serverEl.textContent=v.name; }); }catch(e){}
    // The handshake. Until this goes out the client is holding its own events, and a
    // page that never reports simply never hears anything.
    try{ Open77.ready(); }catch(e){}
  }
})();
</script>
</body>
</html>
