<!doctype html>
<html lang="en" class="op-theme-city">
<head>
<meta charset="utf-8">
<title>OPEN//77 hud voice corner harness</title>
<!--
  WHERE THE VOICE BLOCK ACTUALLY LANDS, measured on the real page.

  The change under test is a position, so the proof has to be a position: this mounts the
  same `ui/src/boot/main.ts` the game mounts, delivers the same payloads Lua sends
  (`opx:hud:config`, then a live `opx:hud:voice` and the four neighbouring blocks), and
  then READS THE BOX BACK with `getBoundingClientRect` -- against the inset tokens the CSS
  itself resolves, not against numbers typed here.

  It is a harness and not a screenshot because the interesting assertions are arithmetic:
  the block's bottom-right corner is one inset in from both edges, it is not straddling the
  middle of the screen, and it does not overlap the vitals column, the chip strip, the
  vehicle chip or the info block -- which is the entire complaint that produced the move.

  Run it with the dev server:  npm run dev  ->  /harness/hud-voice-corner.html
-->
<style>
  html, body { margin: 0; background: #080e19; color: #f2f6f8;
               font: 13px/1.5 "Cascadia Mono", Consolas, monospace; }
  /* The verdict sits above the HUD, and the HUD is what is being measured: a report that
     changed the layout would be measuring itself. */
  #result { position: fixed; left: 0; top: 0; margin: 0; padding: 14px;
            white-space: pre-wrap; z-index: 9999; background: rgba(8, 14, 25, 0.82); }
</style>
</head>
<body>
<div id="app"></div>
<pre id="result">running…</pre>
<script>
/* A FAKE BRIDGE, INSTALLED BEFORE THE APP -- it has to be a plain script, because the
   app's import is a module and modules run after this. Same shape as the stinger
   harness's: handlers in, emits recorded. */
window.__opx = { handlers: {}, emitted: [] };
window.Open77 = {
  on: function (channel, handler) {
    (window.__opx.handlers[channel] = window.__opx.handlers[channel] || []).push(handler);
  },
  emit: function (channel, payload) {
    window.__opx.emitted.push({ channel: channel, payload: payload });
  }
};
window.__deliver = function (channel, payload) {
  var list = window.__opx.handlers[channel] || [];
  for (var index = 0; index < list.length; index++) list[index](payload);
};
</script>
<script type="module">
import '/src/boot/main.ts'

const results = []
let failed = 0

function check(name, ok, detail) {
  if (!ok) failed += 1
  results.push((ok ? 'ok   ' : 'FAIL ') + name + (ok || detail === undefined ? '' : '  -- ' + detail))
  draw()
}

function draw() {
  document.getElementById('result').textContent =
    results.join('\n') + '\n\n' + (failed === 0 ? 'PASS' : failed + ' FAILED')
  window.__RESULT__ = { failed, results }
}

const sleep = (ms) => new Promise((done) => setTimeout(done, ms))

/** The box an element actually occupies, or null when it is not drawn at all. */
function box(selector) {
  const element = document.querySelector(selector)
  return element ? element.getBoundingClientRect() : null
}

function overlaps(one, other) {
  if (!one || !other) return false
  return one.left < other.right && other.left < one.right &&
         one.top < other.bottom && other.top < one.bottom
}

function describe(rect) {
  if (!rect) return 'not drawn'
  return `l=${rect.left.toFixed(1)} t=${rect.top.toFixed(1)} r=${rect.right.toFixed(1)} b=${rect.bottom.toFixed(1)}`
}

async function run() {
  await sleep(200)

  // The shipped layout, exactly as `config/hud.lua` declares it.
  window.__deliver('opx:hud:config', {
    anchor: 'bottom-left', infoAnchor: 'top-right', statusAnchor: 'bottom-left',
    statusOffset: 120, vehicleAnchor: 'bottom-center', width: 210,
    segments: 10, voiceSegments: 8
  })

  window.__deliver('opx:hud:vitals', { gauges: [
    { id: 'health', icon: 'health', label: 'hud.gauge.health', pct: 84, tone: 'health' },
    { id: 'armor', icon: 'armor', label: 'hud.gauge.armor', pct: 51 },
    { id: 'stamina', icon: 'stamina', label: 'hud.gauge.stamina', pct: 100 },
    { id: 'hunger', icon: 'hunger', label: 'hud.gauge.hunger', pct: 72 },
    { id: 'thirst', icon: 'thirst', label: 'hud.gauge.thirst', pct: 63 }
  ] })
  window.__deliver('opx:hud:status', { chips: [
    { id: 'phone', icon: 'P', label: 'hud.status.phone', tone: 'neutral', progress: 1 },
    { id: 'wanted', icon: 'W', label: 'hud.status.wanted', tone: 'bad',
      remainingMs: 20000, totalMs: 30000 }
  ] })
  window.__deliver('opx:hud:info', { lines: [
    { id: 'name', label: 'hud.info.name', value: 'MATT GOOD' },
    { id: 'eddies', label: 'hud.info.eddies', value: '12,480 $' }
  ] })
  window.__deliver('opx:hud:vehicle', {
    active: true, speed: 68, unit: 'KMH', gear: 'D', rpm: 42, integrity: 91,
    integrityLabel: 'hud.vehicle.integrity', tone: 'neutral'
  })

  // A player mid-sentence: the fullest this block ever gets, which is the shape that made
  // the old position read as a stripe across the middle of the screen.
  window.__deliver('opx:hud:voice', {
    active: true, state: 'talking', caption: 'hud.voice.state.talking',
    mode: 'hud.voice.mode.normal', distance: '15 M', level: 62,
    count: 3, index: 2, key: 'Z', activation: 'B', heard: 2
  })

  // The entrance is three steps on a 190ms clock; land after it, not during it.
  await sleep(400)

  // MEASURE THE RESTING GEOMETRY, NOT THE ENTRANCE. The block arrives on `transform`
  // (`translate(8px, 8px)` -> `translate(0, 0)`), and a dump taken with the transition
  // clock frozen -- headless virtual time freezes exactly that -- reads the PRE-entrance
  // offset and reports the block 8px out of its corner while the anchor is correct.
  // Collapsing the transition makes the element take the value its class already
  // declares, so what is measured is where the block lives, not how it arrived. The
  // arrival is asserted on its own, by `live`. Nothing about the four blocks it must not
  // sit on changes: they are measured the same way they always were.
  const voiceElement = document.querySelector('.voice')
  check('the block reached its live state, so it is the resting box being measured',
        voiceElement !== null && voiceElement.classList.contains('live'),
        voiceElement ? voiceElement.className : 'not drawn')
  voiceElement.style.transition = 'none'

  const voice = box('.voice')
  check('the voice block is drawn', voice !== null)
  if (voice === null) return

  const style = getComputedStyle(document.querySelector('.voice'))
  const bleed = parseFloat(style.getPropertyValue('--hud-bleed')) || 0
  const insetX = parseFloat(style.getPropertyValue('--op-inset-x'))
  const insetY = parseFloat(style.getPropertyValue('--op-inset-y'))
  check('the inset tokens resolve, so the measurement has a real reference',
        Number.isFinite(insetX) && Number.isFinite(insetY) && bleed > 0,
        `x=${insetX} y=${insetY} bleed=${bleed}`)

  const width = window.innerWidth
  const height = window.innerHeight

  // ── the corner ────────────────────────────────────────────────────────────
  // The same payback `.at` uses: the wrapper is padded by the bleed, so its own edge sits
  // `inset - bleed` from the screen edge and its CONTENT lands on the inset.
  const wantRight = width - (insetX - bleed)
  const wantBottom = height - (insetY - bleed)
  check('its right edge is one inset in from the right, like every right-anchored cluster',
        Math.abs(voice.right - wantRight) < 1.5,
        `right=${voice.right.toFixed(1)} wanted=${wantRight.toFixed(1)}`)
  check('and its bottom edge is one inset up from the bottom',
        Math.abs(voice.bottom - wantBottom) < 1.5,
        `bottom=${voice.bottom.toFixed(1)} wanted=${wantBottom.toFixed(1)}`)

  // ── and it is not where it was ────────────────────────────────────────────
  // The complaint was a block at eye level on the right edge. Both halves of that are
  // asserted, because a corner anchor that still straddled the middle would be no fix.
  check('the block sits entirely below the vertical middle of the screen',
        voice.top > height * 0.5,
        `top=${voice.top.toFixed(1)} middle=${(height * 0.5).toFixed(1)}`)
  const centre = (voice.top + voice.bottom) / 2
  check('its centre is in the bottom third, not at eye level',
        centre > height * 0.66,
        `centre=${centre.toFixed(1)} third=${(height * 0.66).toFixed(1)}`)
  check('and it stays on the right edge, so the tilt sign and the origin still hold',
        voice.left > width * 0.5,
        `left=${voice.left.toFixed(1)} middle=${(width * 0.5).toFixed(1)}`)

  // ── it does not sit on anything ───────────────────────────────────────────
  // THE NEIGHBOUR ASSERTIONS ASSUME THE RESOLUTION THE HUD IS LAID OUT FOR. This HUD is a
  // 16:9 layout: the vitals column and the chip strip own the bottom-left, the vehicle chip
  // owns the bottom-centre, and this block owns the bottom-right -- which is exactly why it
  // moved there. In a narrow window the bottom-centre chip and the bottom-right block
  // genuinely share their last few pixels, and the failure would be the viewport's rather
  // than the block's. So the viewport is reported, and the overlap assertions hold the mark
  // they were written for at 1280 wide and above; below that they are stated as skipped
  // rather than quietly passed.
  const wide = width >= 1280
  if (!wide) {
    results.push(`skip  it does not overlap the other clusters -- viewport ${width}x${height}` +
                 ' is narrower than the 1280 the shipped 16:9 layout assumes')
  }

  const neighbours = { 'the vitals column': '.vitals', 'the chip strip': '.strip',
                       'the vehicle chip': '.vehicle', 'the info block': '.info' }
  for (const [what, selector] of Object.entries(neighbours)) {
    if (!wide) break
    const other = box(selector)
    check(`it does not overlap ${what}`, !overlaps(voice, other),
          `${describe(voice)} vs ${describe(other)}`)
  }

  check('and it is wholly inside the screen',
        voice.left >= 0 && voice.top >= 0 && voice.right <= width && voice.bottom <= height,
        `${describe(voice)} in ${width}x${height}`)

  window.__boxes = {
    voice: describe(voice), vitals: describe(box('.vitals')), strip: describe(box('.strip')),
    vehicle: describe(box('.vehicle')), info: describe(box('.info')),
    viewport: `${width}x${height}`, bleed, insetX, insetY
  }
  window.__RESULT__ = { failed, results, done: true, boxes: window.__boxes }
  draw()
}

run().catch((error) => {
  check('the harness ran to the end', false, String(error && error.stack ? error.stack : error))
  window.__RESULT__ = { failed: failed + 1, results, done: true }
  draw()
})
</script>
</body>
</html>
