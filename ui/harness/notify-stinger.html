<!doctype html>
<html lang="en" class="op-theme-city">
<head>
<meta charset="utf-8">
<title>OPEN//77 stinger harness</title>
<!--
  THE ORDER A STINGER PUTS A MESSAGE IN, driven against the REAL page.

  What this page is for, and what it is not: whether the deployed CEF can play the two
  files is answered against the deployed binary with the platform's own self-test
  (`Open77.WebHost.exe --open77-self-test-probe`), and the answer is in the research
  note. This harness answers the other half -- the SEQUENCE -- and it therefore stubs
  the decoder so the sequence is deterministic rather than a race against a real
  one. It mounts the same `ui/src/boot/main.ts` the game mounts, on a fake bridge:

    * the message is NOT in the document while the opening clip plays;
    * it appears when that clip ends;
    * it goes when its lifetime ends;
    * and only then does the closing clip start.

  Run it with the dev server:  npm run dev  ->  /harness/notify-stinger.html
-->
<style>
  html, body { margin: 0; background: #080e19; color: #f2f6f8;
               font: 13px/1.5 "Cascadia Mono", Consolas, monospace; }
  #result { position: fixed; left: 0; top: 0; margin: 0; padding: 15px;
            white-space: pre-wrap; z-index: 9999; }
</style>
</head>
<body>
<div id="app"></div>
<pre id="result">running…</pre>
<script>
/* A FAKE BRIDGE, INSTALLED BEFORE THE APP. It has to be this and not the app's own dev
   shim: a shim answers by itself, and this harness has to DELIVER payloads TO the app
   and read what the app emits. It must be a plain script, because the app's import is a
   module and modules run after this. */
window.__opx = { handlers: {}, emitted: [], audio: [] };
window.Open77 = {
  on: function (channel, handler) {
    (window.__opx.handlers[channel] = window.__opx.handlers[channel] || []).push(handler);
  },
  emit: function (channel, payload) {
    window.__opx.emitted.push({ channel: channel, payload: payload });
  }
};
window.__deliver = function (channel, payload) {
  var list = window.__opx.handlers[channel] || [];
  for (var index = 0; index < list.length; index++) list[index](payload);
};

/* A STAND-IN FOR THE DECODER. `autoEnd` decides whether a clip plays through;
   `refuse` decides whether the browser refuses to start it at all. */
window.__clip = { autoEnd: true, refuse: false };
/* The URL arrives on the CONSTRUCTOR (`new Audio(url)`), which is how the page asks for
   a clip -- so a stub that only watched the property would record every clip as empty
   and report a working page as broken. */
window.Audio = function (source) {
  var self = this;
  var record = { src: source === undefined ? '' : String(source),
                 volume: 0, played: false, ended: false, events: {} };
  window.__opx.audio.push(record);

  this.preload = ''; this.currentTime = 0; this.error = null;
  Object.defineProperty(this, 'src', {
    get: function () { return record.src; },
    set: function (value) { record.src = String(value); }
  });
  Object.defineProperty(this, 'volume', {
    get: function () { return record.volume; },
    set: function (value) { record.volume = value; }
  });
  this.play = function () {
    record.played = true;
    if (window.__clip.refuse) return Promise.reject(new Error('NotAllowedError'));
    if (window.__clip.autoEnd) setTimeout(function () { self.dispatchEvent({ type: 'ended' }); }, 30);
    return Promise.resolve();
  };
  this.addEventListener = function (type, handler) { record.events[type] = handler; };
  this.dispatchEvent = function (event) {
    if (event.type === 'ended') record.ended = true;
    if (record.events[event.type]) record.events[event.type](event);
    return true;
  };
};
</script>
<script type="module">
import '/src/boot/main.ts'

const CLIP_DIR = 'audio/'
const results = []
let failed = 0

function check(name, ok, detail) {
  if (!ok) failed += 1
  results.push((ok ? 'ok   ' : 'FAIL ') + name + (ok || detail === undefined ? '' : '  -- ' + detail))
  draw()
}

function draw() {
  const text = results.join('\n') + '\n\n' + (failed === 0 ? 'PASS' : failed + ' FAILED')
  document.getElementById('result').textContent = text
  window.__RESULT__ = { failed, results }
}

const sleep = (ms) => new Promise((done) => setTimeout(done, ms))

/** What the toast area actually draws: the text the player would read. */
function drawn() {
  const host = document.getElementById('app')
  return host ? host.textContent || '' : ''
}

function clips() {
  return window.__opx.audio.map((entry) => entry.src)
}

const show = (payload) => window.__deliver('opx:notify:show', payload)

async function run() {
  // The app mounts on its own; give it a tick to bind its channels.
  await sleep(150)

  // ── a stinger wraps the message ──────────────────────────────────────────
  show({ id: 'h1', kind: 'warning', title: 'ANNOUNCEMENT', message: 'THE CITY IS ON',
         durationMs: 400,
         stinger: { open: 'announce-open.mp3', close: 'announce-close.mp3', volume: 0.5 } })

  await sleep(10)
  check('the opening clip is asked for first', clips()[0] === CLIP_DIR + 'announce-open.mp3',
        JSON.stringify(clips()))
  check('and the message is NOT drawn while it plays', drawn().indexOf('THE CITY IS ON') === -1,
        JSON.stringify(drawn().slice(0, 80)))
  check('at the volume the runtime sent', window.__opx.audio[0] && window.__opx.audio[0].volume === 0.5,
        String(window.__opx.audio[0] && window.__opx.audio[0].volume))

  await sleep(90)
  check('once it ends the message appears', drawn().indexOf('THE CITY IS ON') !== -1,
        JSON.stringify(drawn().slice(0, 80)))
  check('and nothing else has been played yet', clips().length === 1, JSON.stringify(clips()))

  // ── and closes it ────────────────────────────────────────────────────────
  // The lifetime (400) plus the exit transition (260) plus room to spare.
  await sleep(800)
  check('the message goes when its lifetime ends', drawn().indexOf('THE CITY IS ON') === -1,
        JSON.stringify(drawn().slice(0, 80)))
  check('and only then does the closing clip start',
        clips()[1] === CLIP_DIR + 'announce-close.mp3', JSON.stringify(clips()))

  // ── a toast with no stinger is not held ──────────────────────────────────
  const before = clips().length
  show({ id: 'h2', kind: 'info', message: 'PLAIN NOTICE', durationMs: 5000 })
  await sleep(40)
  check('a toast with no stinger is drawn at once', drawn().indexOf('PLAIN NOTICE') !== -1,
        JSON.stringify(drawn().slice(0, 80)))
  check('and plays nothing', clips().length === before, JSON.stringify(clips()))

  // ── a refused playback still shows the message ───────────────────────────
  window.__clip.refuse = true
  show({ id: 'h3', kind: 'warning', message: 'REFUSED AUDIO', durationMs: 5000,
         stinger: { open: 'announce-open.mp3', close: 'announce-close.mp3', volume: 1 } })
  await sleep(80)
  check('a refused playback still draws the message', drawn().indexOf('REFUSED AUDIO') !== -1,
        JSON.stringify(drawn().slice(0, 120)))
  window.__clip.refuse = false

  // ── a held toast cannot outlive its clip ─────────────────────────────────
  window.__clip.autoEnd = false
  show({ id: 'h4', kind: 'warning', message: 'EDGE CASE', durationMs: 5000,
         stinger: { open: 'announce-open.mp3', close: '', volume: 1 } })
  await sleep(120)
  check('a clip that never ends has not drawn its message yet',
        drawn().indexOf('EDGE CASE') === -1, JSON.stringify(drawn().slice(0, 120)))
  window.__clip.autoEnd = true

  window.__RESULT__ = { failed, results, done: true }
  draw()
}

run().catch((error) => {
  check('the harness ran to the end', false, String(error && error.stack ? error.stack : error))
  window.__RESULT__ = { failed: failed + 1, results, done: true }
  draw()
})
</script>
</body>
</html>
