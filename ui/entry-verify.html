<!doctype html>
<html lang="en" class="op-theme-city">
<head>
  <meta charset="utf-8">
  <title>OPEN//77 entry check</title>
</head>
<body>
  <div id="app"></div>
  <script type="module">
    import EntryView from '/src/modules/entry/EntryView.vue'
    import { createSurface } from '/src/boot/createSurface'
    import { registerModule } from '/src/boot/registry'
    import SurfaceRoot from '/src/boot/SurfaceRoot.vue'

    registerModule({ id: 'entry', surface: 'modal', component: EntryView })

    createSurface({
      name: 'modal',
      root: SurfaceRoot,
      rootProps: { surface: 'modal' },
      allowFocus: true
    })
  </script>
</body>
</html>
