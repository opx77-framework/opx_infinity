name: check

on:
  push:
    # FEATURE BRANCHES TOO, so a branch is proven before its PR exists. The
    # checks are the same ones the PR would run, and a red branch is read
    # while it is still cheap to change.
    branches: [main, 'feature/**']
  pull_request:

jobs:
  lua:
    runs-on: ubuntu-latest
    steps:
      # THE ACTIONS' OWN RUNTIME: v7 of checkout and setup-node run on Node 24.
      # v4 targeted Node 20, which GitHub has deprecated; every run carried the
      # warning while the runner forced them onto Node 24 anyway.
      - uses: actions/checkout@v7

      # THE SUITE LOADS THE REAL LIBRARY, not a stub -- a stub would pass while
      # the two repositories drifted apart, which is the one thing it is there
      # to catch. So the runner needs opx_lib on disk.
      #
      # It is cloned INTO the workspace rather than beside it, because
      # actions/checkout refuses a path outside the workspace; every Lua scan
      # below excludes ./opx_lib so the library is not mistaken for files of
      # ours that nobody listed in the manifest.
      #
      # While opx_lib is PRIVATE this needs a token that can read it, as the
      # OPX_LIB_TOKEN secret: github.token is scoped to this repository alone.
      # Making opx_lib public removes the need for the secret entirely.
      - name: The library the client half imports
        uses: actions/checkout@v7
        with:
          repository: opx77-framework/opx_lib
          path: opx_lib
          token: ${{ secrets.OPX_LIB_TOKEN || github.token }}

      - name: Install Lua 5.4
        run: sudo apt-get update && sudo apt-get install -y lua5.4

      # open77.lua is the manifest DSL, not Lua: `auto_start true` does not parse.
      - name: Syntax
        run: find . -name '*.lua' -not -name 'open77.lua' -not -path './opx_lib/*' -exec luac5.4 -p {} +

      - name: Tests
        env:
          OPX_LIB_PATH: opx_lib
        run: lua5.4 tests/run.lua

      # THE SUITE CANNOT SEE THIS ONE. It runs plain `lua5.4`, where every global
      # exists; the client's sandbox removes `setmetatable` and the server's removes
      # `require`, and a shared script runs in both. A metatable in a shared file
      # therefore passes every test above and then refuses the whole resource at
      # activation, taking the session with it. This step reads the manifest's own
      # script kinds and refuses a global the named runtime does not have -- in
      # every resource of the tree, extras/opx_sandy_view's included.
      - name: Sandbox globals
        run: python3 tools/check-sandbox-globals.py

      # Every script the resource ships has to be listed, one per line. A glob
      # would be worse than useless here: an empty one refuses the whole set it
      # belongs to, and the failure only shows up after a rename.
      #
      # EVERY RESOURCE IN THE TREE, not only the root one. A folder with an
      # open77.lua of its own is a resource of its own -- extras/opx_sandy_view,
      # the Sandevistan's preload, is one -- and its paths are relative to that
      # folder, which is how the platform reads them.
      - name: Every manifest path exists
        run: |
          missing=0
          while read -r manifest; do
            dir=$(dirname "$manifest")
            while read -r file; do
              [ -f "$dir/$file" ] || { echo "${manifest#./} lists a file that is not there: $file"; missing=1; }
            done < <(grep -oE '^\s*(shared|server|client)_script\s+"[^"]+"' "$manifest" \
                     | sed -E 's/.*"([^"]+)"/\1/')
          done < <(find . -name open77.lua -not -path './.git/*' -not -path './opx_lib/*' | sort)
          exit $missing

      # A parked file is one the manifest names on a commented-out script line:
      # written, on disk, deliberately not loading yet. Parking stays a one-line
      # edit in open77.lua rather than a change here, and the job still prints
      # what is parked so it cannot be forgotten. A file in neither list is
      # forgotten, and still fails.
      #
      # A FILE ANSWERS TO THE MANIFEST OF THE RESOURCE IT IS IN: the nearest
      # folder above it that has an open77.lua. extras/opx_sandy_view's scripts
      # are listed in extras/opx_sandy_view/open77.lua, which the platform loads
      # as a resource of its own; held to the root manifest they read as
      # forgotten -- f5ded16 went red on exactly those three files.
      - name: Every Lua file is in the manifest
        run: |
          orphans=0
          paths() {
            grep -oE "$1"'(shared|server|client)_script\s+"[^"]+"' "$2" \
              | sed -E 's/.*"([^"]+)"/\1/' | sort -u
          }
          declare -A listed parked
          resources=()
          while read -r manifest; do
            dir=$(dirname "$manifest")
            resources+=("$dir")
            listed[$dir]=$(paths '^\s*' "$manifest")
            parked[$dir]=$(paths '^\s*--\s*' "$manifest")
          done < <(find . -name open77.lua -not -path './.git/*' -not -path './opx_lib/*')
          while read -r file; do
            owner=.
            for dir in "${resources[@]}"; do
              case "$file" in
                "$dir"/*) if [ ${#dir} -gt ${#owner} ]; then owner=$dir; fi ;;
              esac
            done
            rel=${file#"$owner"/}
            case "$rel" in tests/*|open77.lua) continue ;; esac
            if echo "${listed[$owner]}" | grep -qxF "$rel"; then
              continue
            elif echo "${parked[$owner]}" | grep -qxF "$rel"; then
              echo "parked, so it does not load yet: ${file#./}"
            else
              manifest=${owner#./}/open77.lua
              echo "not listed in ${manifest#./}, so it never loads: ${file#./}"
              orphans=1
            fi
          done < <(find . -name '*.lua' -not -path './.git/*' -not -path './opx_lib/*')
          exit $orphans

      # SQL lives in the storage bridge and in a module's own storage file. A
      # statement anywhere else is a module writing behind the runtime's back.
      # tests/ is exempt: it stubs the bridge rather than calling it.
      - name: SQL stays in storage
        run: |
          stray=$(grep -rln 'MySQL\.' --include='*.lua' . \
                  | grep -vE '^\./(tests/|lib/server/storage\.lua$|modules/[a-z]+/server/storage\.lua$)' \
                  || true)
          [ -z "$stray" ] || { echo "SQL outside storage: $stray"; exit 1; }

  # THE SHIPPED ARTEFACT IS web/, AND IT IS COMMITTED: ui/ never leaves the
  # repo (see package.json). So a change under ui/src that forgot the build is
  # a stale bundle on every server it reaches, and NO Lua check above can see
  # it -- the suite reads ui/src as text and web/ as shipped. This job builds
  # the bundle and then asserts the build changed NOTHING: the web/index.html
  # in the tree has to be the one these tools just produced, byte for byte.
  #
  # If the last step goes red the fix is `npm run build` at the repo root and
  # committing web/index.html -- that is the whole convention.
  ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # THE NODE MAJOR THE BUNDLE IS BUILT WITH. The lockfile pins every tool,
      # but the runner's Node is ours to choose, and the step above compares
      # bytes: the runner should be the machine that commits, so this pins the
      # major the maintainers build on.
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: The committed bundle is the built one
        run: |
          if ! git diff --exit-code -- web/index.html; then
            echo 'web/index.html is stale: run `npm run build` at the repo root and commit it.'
            exit 1
          fi
